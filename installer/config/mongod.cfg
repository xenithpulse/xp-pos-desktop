# C:\ProgramData\XP POS\mongod.cfg
# MongoDB configuration for the XP POS appliance (YAML).
# Installed to ProgramData, NOT Program Files: a technician may need to tune
# this on site, and an installer upgrade must never overwrite it.

storage:
  # Database files. Must live on the ProgramData side so an upgrade that
  # replaces Program Files cannot delete the restaurant's data.
  dbPath: C:\ProgramData\XP POS\mongo

  # NOTE: wiredTiger.engineConfig.cacheSizeGB is deliberately left at the
  # default (50% of RAM minus 1 GB). On a 4 GB POS box that lands around
  # 1.5 GB, which is sane. Set it explicitly only if this box shares RAM with
  # something else — starving WiredTiger causes stalls that look like network
  # problems from the floor.

net:
  port: 27017

  # ── SECURITY: DO NOT CHANGE THIS TO 0.0.0.0 OR THE BOX'S LAN IP ───────────
  # This database has NO authentication enabled. Loopback-only binding is the
  # single control keeping it off the network. Under Docker the compose file
  # ran with --bind_ip_all, which was survivable only because the port was
  # never published to the host; natively there is no such barrier and a
  # non-loopback bind would hand every device on the LAN full read/write access
  # to orders, prices, and login records.
  # Only the app (same machine) ever connects.
  bindIp: 127.0.0.1

replication:
  # Single-node replica set. This is REQUIRED, not optional: the app uses
  # multi-document transactions (fire-order, order edits, table sessions, cash
  # slips) and MongoDB refuses those on a standalone mongod. The installer runs
  # a one-time rs.initiate() to bring this node up as the primary of rs0.
  replSetName: rs0

systemLog:
  # Deliberately NOT set to a file. mongod logs to stdout and the WinSW wrapper
  # captures and rolls it (10 MB x 5 files, see XPPOS-MongoDB.xml). mongod's own
  # log rotation only triggers on an explicit logRotate command or SIGUSR1,
  # neither of which has a natural scheduler on Windows — so an appliance left
  # running for a year would grow one unbounded log file. Letting WinSW own
  # rotation is what makes this maintenance-free.
  verbosity: 0
  quiet: false
